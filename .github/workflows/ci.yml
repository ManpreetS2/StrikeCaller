name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs and non-main dispatches isolate by ref and may cancel superseded runs.
# Production (push/dispatch on main) shares one Pages group and does not cancel
# an in-progress deploy, so a newer main run becomes the final release after
# the current one finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'pages' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  pages:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build for GitHub Pages
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build:pages

      - name: Verify Pages build artifact
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run verify:pages

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [e2e, pages]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public availability of the deployed site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${PAGE_URL:-}" ]; then
            echo "::error::deploy job did not expose a page_url output"
            exit 1
          fi

          # Normalize to a single trailing slash.
          base_url="${PAGE_URL%/}/"
          bust="${base_url}?sha=${COMMIT_SHA}"
          echo "Canonical Pages URL: ${base_url}"
          echo "Cache-busted URL:    ${bust}"

          attempts=12
          delay=10
          html=""
          success=0
          for i in $(seq 1 "${attempts}"); do
            echo "Attempt ${i}/${attempts}: GET ${bust}"
            code=$(curl -sSL -o /tmp/page.html -w '%{http_code}' -H 'Cache-Control: no-cache' "${bust}" || echo "000")
            echo "  HTTP ${code}"
            if [ "${code}" = "200" ]; then
              html=$(cat /tmp/page.html)
              # Guard against GitHub's generic Pages 404 served with a 200 in edge cases.
              if printf '%s' "${html}" | grep -qi "There isn't a GitHub Pages site here"; then
                echo "  Served GitHub generic 404 body; retrying after propagation delay"
              else
                success=1
                break
              fi
            fi
            sleep "${delay}"
          done

          if [ "${success}" -ne 1 ]; then
            echo "::error::Public site did not become available at ${base_url}"
            exit 1
          fi

          # Confirm the StrikeCaller app shell, not a placeholder/404.
          title=$(printf '%s' "${html}" | grep -oiE '<title>[^<]*</title>' | head -n 1 || true)
          if ! printf '%s' "${title}" | grep -q 'StrikeCaller'; then
            echo "::error::Deployed HTML title did not contain StrikeCaller"
            exit 1
          fi
          if printf '%s' "${title}" | grep -qiE 'hotfix|GitHub Pages'; then
            echo "::error::Deployed HTML title still looks like a hotfix or Pages-debug title"
            exit 1
          fi
          if ! printf '%s' "${html}" | grep -q 'id="root"'; then
            echo "::error::Deployed HTML is missing the StrikeCaller app root"
            exit 1
          fi

          # Extract local JS/CSS asset URLs referenced by the page.
          assets=$(printf '%s' "${html}" \
            | grep -oE '(src|href)="[^"]+\.(js|css)"' \
            | sed -E 's/^(src|href)="//; s/"$//' \
            | grep -vE '^https?://' || true)

          if [ -z "${assets}" ]; then
            echo "::error::No local JS/CSS asset references found in deployed HTML"
            exit 1
          fi

          host="$(printf '%s' "${base_url}" | sed -E 's#^(https?://[^/]+).*#\1#')"
          echo "Checking local assets under ${host}"
          while IFS= read -r asset; do
            [ -z "${asset}" ] && continue
            case "${asset}" in
              /*) asset_url="${host}${asset}" ;;
              ./*) asset_url="${base_url}${asset#./}" ;;
              *) asset_url="${base_url}${asset}" ;;
            esac
            acode=$(curl -sSL -o /dev/null -w '%{http_code}' "${asset_url}?sha=${COMMIT_SHA}" || echo "000")
            echo "  asset ${asset_url} -> HTTP ${acode}"
            if [ "${acode}" != "200" ]; then
              echo "::error::Required local asset failed: ${asset_url} (HTTP ${acode})"
              exit 1
            fi
          done <<< "${assets}"

          {
            echo "### StrikeCaller Pages availability verified"
            echo ""
            echo "- Canonical URL: ${base_url}"
            echo "- HTTP status: 200"
            echo "- Local JS/CSS assets: all HTTP 200"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "Public availability verified at ${base_url}"
